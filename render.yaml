services:
  - type: web
    name: kerala-lottery-v10
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node --max-old-space-size=256 src/index.js
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_CHAT_ID
        sync: false
