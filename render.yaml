services:
  - type: web
    name: kerala-lottery-analyzer
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: MAX_TICKETS_PER_PHOTO
        value: "10"
